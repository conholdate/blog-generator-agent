# content/AsposeCloud/kra_run_aspose_cloud.yaml
# KRA run configuration for Aspose.Cloud (example template)

meta:
  blog_name: "aspose.cloud"
  brand: "Aspose.Cloud"
  created_at: "2026-02-25"
  owner: "content-team"

engine:
  # === Core KRA inputs ===
  input_file: "content/Aspose.Cloud/keywords.csv"
  use-serp-api: false
  serp-topic: "<OPTIONAL_TOPIC_FOR_SERP>"

  # IMPORTANT: treat Aspose.Cloud as a different brand namespace
  brand: "Aspose.Cloud"
  product: "Aspose.PDF Cloud SDK"     # e.g. "Aspose.Words Cloud" (your naming)
  platform: "Java"               # or your internal label (REST, Java, .NET, etc.)
  # locale: "en-US"

  # === KRA behavior tuning ===
  top_clusters: 15
  max_rows: 50000
  use_content_index: true           # enable if you want existing-topic dedupe
  include_product_in_title: true
  debug: false
  output_dir: "content/Aspose.Cloud/output"

content_index:
  # Where the aspose.cloud blog content lives locally
  local_root: "C:\\GitHub\\aspose-cloud-blog\\content"   # <-- change this

  index_file_name: "index.md"
  file_glob: "**/index.md"

  # Repo metadata (for humans / later automation)
  repo_url: "https://github.com/aspose-cloud/aspose-cloud-blog"
  branch: "master"
  subdir: "/content"