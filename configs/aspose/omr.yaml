# Aspose.OMR
blog: aspose
key: omr
platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "vb.net", "visual basic"]
  java:
    display_name: "Java"
    keywords: ["java", "j2se", "j2ee", "jsp"]
  python_net:
    display_name: "Python via .NET"
    keywords: ["python", "python-net", "py", "python .net", "python via .net"]

display_name: "Aspose.OMR"
description: "Optical mark recognition APIs for forms and surveys"
enabled: true

doc_repo: "https://github.com/aspose-omr/Aspose.OMR-Documentation"
doc_branch: "master"
api_repo: "https://github.com/aspose-omr/Aspose.OMR-API-References"
api_branch: "main"
tut_repo: "https://github.com/aspose-omr/aspose-omr-reference-tutorials"
tut_branch: "main"

platforms:
  - net:
      definition: net
      doc_path: "en/net"
      api_path: "english/net"
      tut_path: "omr"
      enabled: true
  - java:
      definition: java
      doc_path: "en/java"
      api_path: "english/java"
      tut_path: "omr"
      enabled: true
  - python_net:
      definition: python_net
      doc_path: "en/python-via-net"
      api_path: "english/python-via-net"
      tut_path: "omr"
      enabled: false

strategic_cluster: OMR / Form Recognition
formats:
- OMR
- PNG
- JPG
- JPEG
- TIFF
- PDF
- CSV
- JSON
actions:
- recognize
- generate
- read
- extract
- process
- export
money_pages:
  net: https://products.aspose.com/omr/net/
  java: https://products.aspose.com/omr/java/
  python_net: https://products.aspose.com/omr/python-net/
docs_pages:
  net: https://docs.aspose.com/omr/net/
  java: https://docs.aspose.com/omr/java/
  python_net: https://docs.aspose.com/omr/python-net/
