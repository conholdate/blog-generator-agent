# Aspose.Note
blog: aspose
key: note
platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "vb.net", "visual basic"]
  java:
    display_name: "Java"
    keywords: ["java", "j2se", "j2ee", "jsp"]
  python_net:
    display_name: "Python via .NET"
    keywords: ["python", "python-net", "py", "python .net", "python via .net"]

display_name: "Aspose.Note"
description: "Microsoft OneNote document processing and conversion APIs"
enabled: true

doc_repo: "https://github.com/aspose-note/Aspose.Note-Documentation"
doc_branch: "master"
api_repo: "https://github.com/aspose-note/Aspose.Note-API-References"
api_branch: "main"
tut_repo: "https://github.com/aspose-note/aspose-note-reference-tutorials"
tut_branch: "main"

platforms:
  - net:
      definition: net
      doc_path: "en/net"
      api_path: "english/net"
      tut_path: "note"
      enabled: true
  - java:
      definition: java
      doc_path: "en/java"
      api_path: "english/java"
      tut_path: "note"
      enabled: true
  - python_net:
      definition: python_net
      doc_path: "en/python-via-net"
      api_path: "english/python-via-net"
      tut_path: "note"
      enabled: false

strategic_cluster: OneNote Automation
formats:
- ONE
- OneNote
- PDF
- HTML
- Image
- PNG
- JPG
actions:
- convert
- create
- read
- edit
- extract
- export
- render
money_pages:
  net: https://products.aspose.com/note/net/
  java: https://products.aspose.com/note/java/
  python_net: https://products.aspose.com/note/python-net/
docs_pages:
  net: https://docs.aspose.com/note/net/
  java: https://docs.aspose.com/note/java/
  python_net: https://docs.aspose.com/note/python-net/
