# Aspose.Page
blog: aspose
key: page
platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "vb.net", "visual basic"]
  java:
    display_name: "Java"
    keywords: ["java", "j2se", "j2ee", "jsp"]
  python_net:
    display_name: "Python via .NET"
    keywords: ["python", "python-net", "py", "python .net", "python via .net"]

display_name: "Aspose.Page"
description: "PostScript, EPS, and XPS document processing APIs"
enabled: true

doc_repo: "https://github.com/aspose-page/Aspose.Page-Documentation"
doc_branch: "master"
api_repo: "https://github.com/aspose-page/Aspose.Page-API-References"
api_branch: "main"
tut_repo: "https://github.com/aspose-page/aspose-page-reference-tutorials"
tut_branch: "main"

platforms:
  - net:
      definition: net
      doc_path: "en/net"
      api_path: "english/net"
      tut_path: "page"
      enabled: true
  - java:
      definition: java
      doc_path: "en/java"
      api_path: "english/java"
      tut_path: "page"
      enabled: true
  - python_net:
      definition: python_net
      doc_path: "en/python-via-net"
      api_path: "english/python-via-net"
      tut_path: "page"
      enabled: false

strategic_cluster: Page Description Language Automation
formats:
- XPS
- OXPS
- EPS
- PS
- PDF
- PNG
- JPG
- TIFF
actions:
- convert
- render
- load
- save
- extract
- export
money_pages:
  net: https://products.aspose.com/page/net/
  java: https://products.aspose.com/page/java/
  python_net: https://products.aspose.com/page/python-net/
docs_pages:
  net: https://docs.aspose.com/page/net/
  java: https://docs.aspose.com/page/java/
  python_net: https://docs.aspose.com/page/python-net/
