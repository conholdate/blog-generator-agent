  java: https://products.aspose.com/drawing/java/
  python_net: https://products.aspose.com/drawing/python-net/
docs_pages:
  net: https://docs.aspose.com/drawing/net/
  java: https://docs.aspose.com/drawing/java/
  python_net: https://docs.aspose.com/drawing/python-net/
