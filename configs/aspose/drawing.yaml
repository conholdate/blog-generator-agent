# Aspose.Drawing
blog: aspose
key: drawing
platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "vb.net", "visual basic"]
  java:
    display_name: "Java"
    keywords: ["java", "j2se", "j2ee", "jsp"]
  python_net:
    display_name: "Python via .NET"
    keywords: ["python", "python-net", "py", "python .net", "python via .net"]

display_name: "Aspose.Drawing"
description: "2D drawing, graphics, and imaging APIs compatible with System.Drawing workflows"
enabled: true

doc_repo: "https://github.com/aspose-drawing/Aspose.Drawing-Documentation"
doc_branch: "master"
api_repo: "https://github.com/aspose-drawing/Aspose.Drawing-API-References"
api_branch: "main"
tut_repo: "https://github.com/aspose-drawing/aspose-drawing-reference-tutorials"
tut_branch: "main"

platforms:
  - net:
      definition: net
      doc_path: "en/net"
      api_path: "english/net"
      tut_path: "drawing"
      enabled: true
  - java:
      definition: java
      doc_path: "en/java"
      api_path: "english/java"
      tut_path: "drawing"
      enabled: false
  - python_net:
      definition: python_net
      doc_path: "en/python-via-net"
      api_path: "english/python-via-net"
      tut_path: "drawing"
      enabled: false

strategic_cluster: Drawing / Graphics Automation
formats:
- PNG
- JPG
- BMP
- GIF
- TIFF
- SVG
- PDF
actions:
- draw
- create
- render
- export
- edit
- convert
money_pages:
