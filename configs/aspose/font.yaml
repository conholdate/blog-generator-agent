# Aspose.Font
blog: aspose
key: font
platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "vb.net", "visual basic"]
  java:
    display_name: "Java"
    keywords: ["java", "j2se", "j2ee", "jsp"]
  python_net:
    display_name: "Python via .NET"
    keywords: ["python", "python-net", "py", "python .net", "python via .net"]

display_name: "Aspose.Font"
description: "Font loading, inspection, conversion, and rendering APIs"
enabled: true

doc_repo: "https://github.com/aspose-font/Aspose.Font-Documentation"
doc_branch: "master"
api_repo: "https://github.com/aspose-font/Aspose.Font-API-References"
api_branch: "main"
tut_repo: "https://github.com/aspose-font/aspose-font-reference-tutorials"
tut_branch: "main"

platforms:
  - net:
      definition: net
      doc_path: "en/net"
      api_path: "english/net"
      tut_path: "font"
      enabled: true
  - java:
      definition: java
      doc_path: "en/java"
      api_path: "english/java"
      tut_path: "font"
      enabled: true
  - python_net:
      definition: python_net
      doc_path: "en/python-via-net"
      api_path: "english/python-via-net"
      tut_path: "font"
      enabled: false

strategic_cluster: Font Conversion and Inspection
formats:
- TTF
- OTF
- WOFF
- WOFF2
- Type1
- CFF
- SVG
actions:
- convert
- load
- read
- extract
- render
- save
money_pages:
  net: https://products.aspose.com/font/net/
  java: https://products.aspose.com/font/java/
  python_net: https://products.aspose.com/font/python-net/
docs_pages:
  net: https://docs.aspose.com/font/net/
  java: https://docs.aspose.com/font/java/
  python_net: https://docs.aspose.com/font/python-net/
