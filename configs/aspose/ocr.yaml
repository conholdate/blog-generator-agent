# Aspose.OCR
blog: aspose
key: ocr
platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "vb.net", "visual basic"]
  java:
    display_name: "Java"
    keywords: ["java", "j2se", "j2ee", "jsp"]
  python_net:
    display_name: "Python via .NET"
    keywords: ["python", "python-net", "py", "python .net", "python via .net"]

display_name: "Aspose.OCR"
description: "Optical character recognition APIs for scanned images and documents"
enabled: true

doc_repo: "https://github.com/aspose-ocr/Aspose.OCR-Documentation"
doc_branch: "master"
api_repo: "https://github.com/aspose-ocr/Aspose.OCR-API-References"
api_branch: "main"
tut_repo: "https://github.com/aspose-ocr/aspose-ocr-reference-tutorials"
tut_branch: "main"

platforms:
  - net:
      definition: net
      doc_path: "en/net"
      api_path: "english/net"
      tut_path: "ocr"
      enabled: true
  - java:
      definition: java
      doc_path: "en/java"
      api_path: "english/java"
      tut_path: "ocr"
      enabled: true
  - python_net:
      definition: python_net
      doc_path: "en/python-via-net"
      api_path: "english/python-via-net"
      tut_path: "ocr"
      enabled: true

strategic_cluster: OCR / Text Recognition
formats:
- PNG
- JPG
- JPEG
- BMP
- TIFF
- PDF
- Image
actions:
- recognize
- extract
- read
- convert
- scan
- export
money_pages:
  net: https://products.aspose.com/ocr/net/
  java: https://products.aspose.com/ocr/java/
  python_net: https://products.aspose.com/ocr/python-net/
docs_pages:
  net: https://docs.aspose.com/ocr/net/
  java: https://docs.aspose.com/ocr/java/
  python_net: https://docs.aspose.com/ocr/python-net/
