  cpp:
    display_name: "C++"
    keywords: ["c++", "cpp", "cplusplus", "aspose.total cloud sdk for c++"]
  php:
    display_name: "PHP"
    keywords: ["php", "aspose.total cloud sdk for php"]
  android:
    display_name: "Android"
    keywords: ["android", "aspose.total cloud sdk for android"]
  python:
    display_name: "Python"
    keywords: ["python", "py", "aspose.total cloud sdk for python"]
  nodejs:
    display_name: "Node.js"
    keywords: ["node.js", "nodejs", "javascript", "js", "aspose.total cloud sdk for node.js"]
  go:
