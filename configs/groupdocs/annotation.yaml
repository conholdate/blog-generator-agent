# GroupDocs.Annotation
blog: groupdocs
key: annotation
display_name: "GroupDocs.Annotation"
description: "Document annotation APIs for adding, editing, and managing annotations in common business file formats."
enabled: true

platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "groupdocs.annotation for .net"]
  java:
    display_name: "Java"
    keywords: ["java", "groupdocs.annotation for java"]
  python:
    display_name: "Python via .NET"
    keywords: ["python", "py", "python via .net", "python-net", "groupdocs.annotation for python via .net"]
  nodejs:
    display_name: "Node.js via Java"
    keywords: ["node.js", "nodejs", "javascript", "js", "node.js via java", "groupdocs.annotation for node.js via java"]
  general:
    display_name: "General"
    keywords: ["groupdocs.annotation", "document annotation api", "annotation library"]

strategic_cluster: Document Annotation Automation
formats:
- PDF
- DOC
- DOCX
- XLS
- XLSX
- PPT
- PPTX
- Image
- PNG
- JPG
actions:
- annotate
- add
- edit
- remove
- extract
- export

money_pages:
  net: https://products.groupdocs.com/annotation/net/
  java: https://products.groupdocs.com/annotation/java/
  python_net: https://products.groupdocs.com/annotation/python-net/
  nodejs_java: https://products.groupdocs.com/annotation/nodejs-java/
docs_pages:
  net: https://docs.groupdocs.com/annotation/net/
  java: https://docs.groupdocs.com/annotation/java/
  python_net: https://docs.groupdocs.com/annotation/python-net/
  nodejs_java: https://docs.groupdocs.com/annotation/nodejs-java/
