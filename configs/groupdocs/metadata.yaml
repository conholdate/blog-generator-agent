  net: https://products.groupdocs.com/metadata/net/
  java: https://products.groupdocs.com/metadata/java/
  python_net: https://products.groupdocs.com/metadata/python-net/
  nodejs_java: https://products.groupdocs.com/metadata/nodejs-java/
docs_pages:
  net: https://docs.groupdocs.com/metadata/net/
  java: https://docs.groupdocs.com/metadata/java/
  python_net: https://docs.groupdocs.com/metadata/python-net/
