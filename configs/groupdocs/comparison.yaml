  java: https://products.groupdocs.com/comparison/java/
  python_net: https://products.groupdocs.com/comparison/python-net/
  nodejs_java: https://products.groupdocs.com/comparison/nodejs-java/
docs_pages:
  net: https://docs.groupdocs.com/comparison/net/
