  java: https://products.groupdocs.com/editor/java/
  python_net: https://products.groupdocs.com/editor/python-net/
  nodejs_java: https://products.groupdocs.com/editor/nodejs-java/
docs_pages:
  net: https://docs.groupdocs.com/editor/net/
  java: https://docs.groupdocs.com/editor/java/
  python_net: https://docs.groupdocs.com/editor/python-net/
