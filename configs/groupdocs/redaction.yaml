# GroupDocs.Redaction
blog: groupdocs
key: redaction
display_name: "GroupDocs.Redaction"
description: "Sensitive data redaction APIs for finding and removing confidential text, metadata, and annotations from files."
enabled: true

platform_definitions:
  net:
    display_name: ".NET"
    keywords: ["c#", "csharp", ".net", "dotnet", "groupdocs.redaction for .net"]
  java:
    display_name: "Java"
    keywords: ["java", "groupdocs.redaction for java"]
  python:
    display_name: "Python via .NET"
    keywords: ["python", "py", "python via .net", "python-net", "groupdocs.redaction for python via .net"]
  nodejs:
    display_name: "Node.js via Java"
    keywords: ["node.js", "nodejs", "javascript", "js", "node.js via java", "groupdocs.redaction for node.js via java"]
  general:
    display_name: "General"
    keywords: ["groupdocs.redaction", "document redaction api", "remove sensitive data library"]

strategic_cluster: Document Redaction Automation
formats:
- PDF
- DOC
- DOCX
- XLS
- XLSX
- PPT
- PPTX
- Image
actions:
- redact
- remove
- sanitize
- search
- replace
- export

