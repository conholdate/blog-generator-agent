id: content-quality
segment: content_quality
intended_audiences:
  - Developers evaluating file-format SDKs
  - Technical content editors
rules:
  - rule_id: CQ-001
    id: thin_content
    severity: High
    condition:
      word_count_lt: 500
    evidence: [word_count]
    explanation: Post is too thin to fully satisfy developer search intent.
    why_it_matters: Thin posts are less likely to cover setup, code, edge cases, and output expectations.
    recommended_fix: Expand with steps, examples, troubleshooting, FAQs, and conclusion.
    expected_seo_impact: High
    estimated_effort: Medium
  - rule_id: CQ-002
    id: moderate_thin_content
    severity: Medium
    condition:
      word_count_between: [500, 799]
    evidence: [word_count]
    explanation: Post is moderately thin for an evergreen developer tutorial.
    why_it_matters: Developer readers usually need complete implementation context.
    recommended_fix: Add examples, screenshots, troubleshooting notes, and a stronger conclusion.
    expected_seo_impact: Medium
    estimated_effort: Medium
  - rule_id: CQ-003
    id: missing_h2_sections
    severity: Medium
    condition:
      h2_count_eq: 0
    evidence: [h2_count]
    explanation: Post has no H2 sections.
    why_it_matters: Clear H2 sections improve scannability and subtopic relevance.
    recommended_fix: Add task-based H2 sections for setup, steps, code, output, and troubleshooting.
    expected_seo_impact: Medium
    estimated_effort: Low
  - rule_id: CQ-004
    id: missing_faq
    severity: Opportunity
    condition:
      faq_like_sections_eq: 0
    evidence: [faq_like_sections]
    explanation: Post has no FAQ-like section.
    why_it_matters: FAQs can cover long-tail developer questions and implementation blockers.
    recommended_fix: Add 3-5 concise FAQs for setup, supported formats, licensing, errors, and output.
    expected_seo_impact: Medium
    estimated_effort: Low
  - rule_id: CQ-005
    id: missing_post_image
    severity: Medium
    condition:
      images_eq: 0
    evidence: [images]
    explanation: Post has no cover, front matter, Markdown, or HTML image.
    why_it_matters: Cover images, visual output, diagrams, and screenshots help developers validate results and improve social/search presentation.
    recommended_fix: Add a relevant cover image, output image, screenshot, or workflow diagram where useful.
    expected_seo_impact: Medium
    estimated_effort: Low
  - rule_id: CQ-006
    id: suggest_body_output_image
    severity: Opportunity
    condition:
      all:
        - body_images_eq: 0
        - front_matter_images_gt: 0
        - matches: "\\b(output|result|screenshot|preview|render|generate|create|convert|write|draw|barcode|qr code|image|jpg|jpeg|png|pdf|docx|xlsx|pptx|html|csv|svg)\\b"
    evidence: [body_images, front_matter_images]
    explanation: Post has a cover/front matter image but no inline body image, and the content appears to describe a visual or generated output.
    why_it_matters: Inline output screenshots help developers confirm that the code produced the expected result.
    recommended_fix: Consider adding an output screenshot or result image inside the post body if it helps readers validate the tutorial result.
    expected_seo_impact: Medium
    estimated_effort: Low
