name: Reconcile Product Data for aspose.cloud

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 11:00 AM PKT

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('mcp-servers/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp-servers/requirements.txt

      - name: Create runtime .env file with secrets
        run: |
          cat > .env << EOF
          REPO_PAT=${{ secrets.GISTS_PAT_ASPOSE_CLOUD }}
          EOF

      - name: Run reconciliation
        id: reconcile
        run: |
          cd mcp-servers/product-reconciler
          python run_reconciliation.py

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-report-aspose-cloud-${{ github.run_number }}
          path: |
            mcp-servers/product-reconciler/reconciliation_report.md
            mcp-servers/product-reconciler/reconciliation_report.json
          if-no-files-found: warn

      ###################################################################
      # Open a PR with whatever changed — never pushed to main directly,
      # and never auto-merged. A human reviews every run's diff.
      ###################################################################
      - name: Create Pull Request
        if: steps.reconcile.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GISTS_PAT_ASPOSE_CLOUD }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          BRANCH_NAME="reconcile/aspose-cloud-${{ github.run_number }}"

          git checkout -b "$BRANCH_NAME"
          git add content/productsData/aspose.cloud.json
          git commit -m "Reconcile aspose.cloud product data [Run #${{ github.run_number }}]"
          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --title "Reconcile aspose.cloud product data (Run #${{ github.run_number }})" \
            --body-file mcp-servers/product-reconciler/reconciliation_report.md \
            --base main \
            --head "$BRANCH_NAME"

      - name: No changes
        if: steps.reconcile.outputs.has_changes != 'true'
        run: echo "Nothing to reconcile this run — aspose.cloud.json is already up to date."
