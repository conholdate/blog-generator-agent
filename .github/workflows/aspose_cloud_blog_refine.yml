name: Blog Refine — dashboard

# Applies one targeted edit to an already-open dashboard-request PR in
# the brand's blog repo (client_payload.brand), instead of generating a new draft. Fires on a
# `repository_dispatch` from the dashboard's "Request a revision" box.
#
# client_payload fields: brand, branch, instruction, requested_by, request_id
# (the instruction itself is also stored as a queued PR comment - see refine_queue.py)

on:
  repository_dispatch:
    types: [blog-refine]

# Without this, GitHub's default run title is just the workflow name, so
# every refine run in the dashboard's "Recent runs" list looked identical -
# no way to tell which draft it was applied to.
run-name: "Refine ${{ github.event.client_payload.branch }} (${{ github.event.client_payload.brand }}): ${{ github.event.client_payload.instruction }}"

permissions:
  contents: write

concurrency:
  group: blog-refine-${{ github.event.client_payload.branch }}
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    # Brands enabled for dashboard requests - keep in sync with the other
    # dashboard workflows and the dashboard's lib/config.ts.
    if: contains(fromJSON('["aspose.cloud", "groupdocs.cloud", "aspose.com", "conholdate.com", "conholdate.cloud"]'), github.event.client_payload.brand)

    steps:
      - uses: actions/checkout@v4

      - name: Resolve brand settings
        uses: ./.github/actions/resolve-brand
        with:
          brand: ${{ github.event.client_payload.brand }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Remove any .env files that could interfere
        run: |
          find . -name ".env" -type f -delete
          echo "Removed all .env files"

      - name: Create Google service account key
        run: |
          mkdir -p keys
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > keys/sheet-reader-494108-bd5e61ef812c.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd agent_engine/blog_generator
          pip install -r requirements.txt
          cd ../../mcp-servers
          pip install -r requirements.txt
          cd ..

      - name: Create runtime .env file with secrets
        run: |
          cat > .env << EOF
          PROFESSIONALIZE_API_KEY_2=${{ secrets.PROFESSIONALIZE_API_KEY_2 }}
          PROFESSIONALIZE_BASE_URL=${{ secrets.PROFESSIONALIZE_BASE_URL }}
          PROFESSIONALIZE_LLM_MODEL=${{ secrets.PROFESSIONALIZE_LLM_MODEL }}
          TOKEN_FOR_TEAM=${{ secrets.TOKEN_FOR_TEAM }}
          METRICS_API_KEY=${{ secrets.METRICS_API_KEY }}
          METRICS_API_URL=${{ vars.METRICS_API_URL }}
          GOOGLE_SCRIPT_URL_FOR_TEAM=${{ vars.GOOGLE_SCRIPT_URL_FOR_TEAM }}
          REPO_PAT=${{ secrets[format('GISTS_PAT_{0}', env.BRAND_KEY)] }}
          GIST_NAME=${{ vars[format('{0}_GIST', env.BRAND_KEY)] }}
          SPREADSHEET_ID_FOR_BLOGPOST_METADATA=${{ secrets[format('{0}_SPREADSHEET_ID_FOR_BLOGPOST_METADATA', env.BRAND_KEY)] }}
          SPREADSHEET_ID_FOR_KEYWORDS=${{ secrets[format('{0}_SPREADSHEET_ID_FOR_KEYWORDS', env.BRAND_KEY)] }}
          GOOGLE_KEY=sheet-reader-494108-bd5e61ef812c.json
          CONSOLIDATED_SHEET_NAME_FOR_BLOGPOST_METADATA=Consolidated
          EOF
          echo ".env file created"

      ###################################################################
      # Check out the EXISTING PR branch in the brand blog repo and find
      # the draft file that's already on it - no new branch, no new PR.
      ###################################################################
      - name: Check out existing draft branch
        id: checkout_draft
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "❌ client_payload.branch is required"
            exit 1
          fi

          echo "Cloning $TARGET_REPO..."
          git clone https://x-access-token:${{ secrets.REPO_PAT }}@github.com/$TARGET_REPO.git blog-repo || {
            echo "❌ Failed to clone repo — invalid PAT or wrong GitHub account."
            exit 1
          }
          cd blog-repo
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # Last path segment: the branch is blog/<folder> or blog/total/<folder> depending on brand.
          FOLDER_NAME="${BRANCH##*/}"
          DRAFT_PATH=$(find content -type d -name "$FOLDER_NAME" -exec test -f "{}/index.md" \; -print | head -1)

          if [ -z "$DRAFT_PATH" ]; then
            echo "❌ Could not find index.md for folder $FOLDER_NAME on branch $BRANCH"
            exit 1
          fi

          echo "draft_path=$(pwd)/$DRAFT_PATH/index.md" >> $GITHUB_OUTPUT
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "✅ Found draft: $DRAFT_PATH/index.md"

      - name: Add 'refining' label
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          cd blog-repo
          PR_NUMBER=$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$PR_NUMBER" ]; then
            gh label create refining --repo "$TARGET_REPO" --color FBCA04 --force >/dev/null 2>&1 || true
            gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --add-label refining >/dev/null 2>&1 || true

            # Recover the original request's product/platform from the PR
            # body's hidden markers (written by blog_request's "Open review
            # PR" step) so this revision's metrics record the real values
            # instead of the "revise"/blank placeholder. A PR opened before
            # these markers existed just leaves both blank - main.py already
            # treats blank the same as its pre-existing behavior.
            PR_BODY_TEXT=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json body --jq '.body' 2>/dev/null || echo "")
            REQUEST_PRODUCT=$(printf '%s' "$PR_BODY_TEXT" | grep -oE '<!-- request-product: .*-->' | sed -E 's/<!-- request-product: (.*) -->/\1/' | head -1)
            REQUEST_PLATFORM=$(printf '%s' "$PR_BODY_TEXT" | grep -oE '<!-- request-platform: .*-->' | sed -E 's/<!-- request-platform: (.*) -->/\1/' | head -1)
            {
              echo "REQUEST_PRODUCT=$REQUEST_PRODUCT"
              echo "REQUEST_PLATFORM=$REQUEST_PLATFORM"
            } >> "$GITHUB_ENV"
          fi

      ###################################################################
      # Work through the PR's revision queue (hidden "refine-queued"
      # comments written by the dashboard), oldest first, one independent
      # single-target pass each, committing to the SAME branch. Runs the
      # whole queue rather than just this dispatch's instruction because
      # GitHub keeps only one pending run per concurrency group - a
      # cancelled pending run would otherwise lose its instruction.
      # See .github/scripts/refine_queue.py.
      ###################################################################
      - name: Process revision queue
        if: env.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          BRANCH: ${{ github.event.client_payload.branch }}
          PR_NUMBER: ${{ env.pr_number }}
          DRAFT_PATH: ${{ steps.checkout_draft.outputs.draft_path }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          INSTRUCTION: ${{ github.event.client_payload.instruction }}
        run: python .github/scripts/refine_queue.py

      - name: Remove 'refining' label
        if: always() && env.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          gh pr edit "$pr_number" --repo "$TARGET_REPO" --remove-label refining >/dev/null 2>&1 || true

      - name: Fail if the PR could not be found
        if: env.pr_number == ''
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          echo "❌ No open PR found for branch $BRANCH"
          exit 1
