name: Blog Keyword Analyzer for GroupDocs.Cloud

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Product name (e.g., GroupDocs.Conversion Cloud SDK)."
        type: choice
        required: true
        options:
          - 'GroupDocs.Annotation Cloud SDK'
          - 'GroupDocs.Assembly Cloud SDK'
          - 'GroupDocs.Classification Cloud SDK'
          - 'GroupDocs.Comparison Cloud SDK'
          - 'GroupDocs.Conversion Cloud SDK'
          - 'GroupDocs.Editor Cloud SDK'
          - 'GroupDocs.Merger Cloud SDK'
          - 'GroupDocs.Metadata Cloud SDK'
          - 'GroupDocs.Parser Cloud SDK'
          - 'GroupDocs.Rewriter Cloud SDK'
          - 'GroupDocs.Signature Cloud SDK'
          - 'GroupDocs.Total Cloud SDK'
          - 'GroupDocs.Translation Cloud SDK'
          - 'GroupDocs.Viewer Cloud SDK'
          - 'GroupDocs.Watermark Cloud SDK'
        default: "GroupDocs.Conversion Cloud SDK"

      platform:
        description: "Optional target platform label (e.g. REST, Java, .NET, Python)."
        required: false
        type: choice
        options:
          - 'REST'
          - 'Java'
          - '.NET'
          - 'Python'
          - 'Node.js'
          - 'PHP'
          - 'Ruby'
          - 'Go'
        default: '.NET'

      keywords_file:
        description: "Keywords file path (recommended: content/GroupDocs.Cloud/keywords.csv). Ignored unless keyword_source=file."
        type: string
        required: true
        default: "content/GroupDocs.Cloud/keywords.csv"

      keyword_source:
        description: "Keyword source."
        type: choice
        required: true
        options:
          - 'file'
          - 'serp_api'
          - 'llm_keywords'
        default: 'file'

      serp_topic:
        description: "Topic seed used when keyword_source is serp_api or llm_keywords."
        type: string
        required: false
        default: ""

      top_clusters:
        description: "How many top clusters to keep (number as text)."
        type: string
        required: false
        default: "15"

      use_content_index:
        description: "If true, clone blog repo and dedupe topics against existing posts."
        type: boolean
        required: false
        default: true

      include_product_in_title:
        description: "If true, enforce product name in generated topic titles. If false, ensure product name is NOT used in titles."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  run-kra:
    runs-on: ubuntu-latest

    env:
      BRAND: "GroupDocs.Cloud"
      KRA_OUTPUT_DIR: "content/GroupDocs.Cloud/output"
      KRA_METRICS_DB_PATH: "content/kra_metrics_db.json"

      PROFESSIONALIZE_BASE_URL: "https://llm.professionalize.com/v1"
      PROFESSIONALIZE_API_KEY: ${{ secrets.PROFESSIONALIZE_API_KEY_1 }}
      OPENAI_API_KEY: ${{ secrets.PROFESSIONALIZE_API_KEY_1 }}

      BLOG_CONTENT_REPO: "groupdocs-cloud/groupdocs-cloud-blog"
      BLOG_CONTENT_ROOT: "blog_content/content"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout GroupDocs.Cloud blog content repo (only if use_content_index=true)
        if: ${{ inputs.use_content_index }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_CONTENT_REPO }}
          path: blog_content
          token: ${{ secrets.ASPOSE_BLOG_TOKEN }}

      - name: Export BLOG_CONTENT_ROOT (only if use_content_index=true)
        if: ${{ inputs.use_content_index }}
        run: |
          echo "BLOG_CONTENT_ROOT=${BLOG_CONTENT_ROOT}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build kra_run.generated.yaml
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          def as_bool(v: str) -> bool:
              return (v or "false").strip().lower() == "true"

          def b(v: bool) -> str:
              return "true" if v else "false"

          brand = os.environ["BRAND"]

          product = os.environ.get("INPUT_PRODUCT", "GroupDocs.Conversion Cloud SDK")
          platform = os.environ.get("INPUT_PLATFORM", ".NET")
          keywords_file = os.environ.get("INPUT_KEYWORDS_FILE", "content/GroupDocs.Cloud/keywords.csv")
          keyword_source = os.environ.get("INPUT_KEYWORD_SOURCE", "file").strip().lower()
          use_serp_api = keyword_source == "serp_api"
          use_llm_keywords = keyword_source == "llm_keywords"
          serp_topic = os.environ.get("INPUT_SERP_TOPIC", "")
          top_clusters = int(os.environ.get("INPUT_TOP_CLUSTERS", "15"))
          use_content_index = as_bool(os.environ.get("INPUT_USE_CONTENT_INDEX", "true"))
          include_product_in_title = as_bool(os.environ.get("INPUT_INCLUDE_PRODUCT_IN_TITLE", "true"))

          locale = "en-US"
          max_rows = 50000
          debug = False

          cfg_path = Path(os.environ["RUNNER_TEMP"]) / "kra_run.generated.yaml"

          blog_name = "groupdocs.cloud"
          blog_root = os.environ.get("BLOG_CONTENT_ROOT", "")

          cfg_text = (
              "meta:\n"
              f"  blog_name: \"{blog_name}\"\n"
              f"  brand: \"{brand}\"\n"
              "  created_at: \"\"\n"
              "  owner: \"content-team\"\n"
              "\n"
              "engine:\n"
              f"  input_file: \"{keywords_file}\"\n"
              f"  use_serp_api: {b(use_serp_api)}\n"
              f"  use_llm_keywords: {b(use_llm_keywords)}\n"
              f"  serp_topic: \"{serp_topic}\"\n"
              "\n"
              f"  brand: \"{brand}\"\n"
              f"  product: \"{product}\"\n"
              f"  platform: \"{platform}\"\n"
              f"  locale: \"{locale}\"\n"
              "\n"
              f"  top_clusters: {top_clusters}\n"
              f"  max_rows: {max_rows}\n"
              f"  use_content_index: {b(use_content_index)}\n"
              f"  include_product_in_title: {b(include_product_in_title)}\n"
              f"  debug: {b(debug)}\n"
              f"  output_dir: \"content/GroupDocs.Cloud/output\"\n"
              "\n"
              "content_index:\n"
              f"  local_root: \"{blog_root}\"\n"
              "  index_file_name: \"index.md\"\n"
              "  file_glob: \"**/index.md\"\n"
              "  repo_url: \"https://github.com/groupdocs-cloud/groupdocs-cloud-blog\"\n"
              "  branch: \"master\"\n"
              "  subdir: \"/content\"\n"
          )

          cfg_path.write_text(cfg_text, encoding="utf-8")
          print("Generated config:", cfg_path)
          print(cfg_text)
          PY

          echo "KRA_CFG_PATH=${RUNNER_TEMP}/kra_run.generated.yaml" >> "$GITHUB_ENV"
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_KEYWORDS_FILE: ${{ inputs.keywords_file }}
          INPUT_KEYWORD_SOURCE: ${{ inputs.keyword_source }}
          INPUT_SERP_TOPIC: ${{ inputs.serp_topic }}
          INPUT_TOP_CLUSTERS: ${{ inputs.top_clusters }}
          INPUT_USE_CONTENT_INDEX: ${{ inputs.use_content_index }}
          INPUT_INCLUDE_PRODUCT_IN_TITLE: ${{ inputs.include_product_in_title }}

      - name: Run KRA
        run: |
          mkdir -p "${KRA_OUTPUT_DIR}"
          python scripts/run_kra_from_config.py --config "${KRA_CFG_PATH}"

      - name: Upload GroupDocs.Cloud outputs
        uses: actions/upload-artifact@v4
        with:
          name: kra-output-GroupDocs.Cloud
          path: |
            content/GroupDocs.Cloud/output/**
            content/kra_metrics_db.json
          if-no-files-found: warn

      - name: Commit GroupDocs.Cloud outputs (with ignore-safe staging)
        run: |
          set -euo pipefail

          echo "=== workspace ==="
          pwd
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "KRA_OUTPUT_DIR=${KRA_OUTPUT_DIR}"

          echo "=== list output ==="
          ls -la "${KRA_OUTPUT_DIR}" || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== git status (before add) ==="
          git status --porcelain=v1 || true

          echo "=== check ignore rules for KRA output ==="
          git check-ignore -v "${KRA_OUTPUT_DIR}"/** 2>/dev/null || true

          git add -A content

          echo "=== staged diff (after add -A content) ==="
          git diff --cached --name-status || true

          if git diff --cached --quiet; then
            echo "No staged changes after 'git add -A content'. Trying force-add on KRA outputs..."
            git add -f "${KRA_OUTPUT_DIR}" || true
            git add -f "${KRA_METRICS_DB_PATH}" || true
          fi

          echo "=== staged diff (final) ==="
          git diff --cached --name-status || true

          if git diff --cached --quiet; then
            echo "No staged changes, skipping commit & push"
            exit 0
          fi

          git commit -m "Update GroupDocs.Cloud KRA results [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
