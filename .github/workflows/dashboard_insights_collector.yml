name: Collect Dashboard Insights (GA4 + GSC)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *" # Daily at 10:00 AM PKT

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agent_engine/blog_generator/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Remove any .env files that could interfere
        run: |
          find . -name ".env" -type f -delete
          echo "Removed all .env files"

      - name: Create Google service account keys
        run: |
          mkdir -p keys
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > keys/sheet-reader-494108-bd5e61ef812c.json
          echo '${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}' > keys/ga4-service-account.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd agent_engine/blog_generator
          pip install -r requirements.txt

      - name: Create runtime .env file with secrets
        run: |
          cat > .env << EOF
          GOOGLE_KEY=sheet-reader-494108-bd5e61ef812c.json
          GA4_GOOGLE_KEY=ga4-service-account.json
          GA4_PROPERTY_ID_GROUPDOCS_CLOUD=${{ secrets.GA4_PROPERTY_ID_GROUPDOCS_CLOUD }}
          EOF
          echo ".env file created"

      - name: Collect insights
        run: python scripts/collect_dashboard_insights.py

      - name: Commit snapshot
        if: always()
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add content/dashboard_insights.json
          git commit -m "Update dashboard insights snapshot [Run #${{ github.run_number }}]" || echo "No changes to commit"
          git push origin HEAD
