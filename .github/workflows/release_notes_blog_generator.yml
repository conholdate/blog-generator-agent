name: Release Notes Blog Generator

on:
  workflow_dispatch:
    inputs:
      release_notes_url:
        description: Aspose release notes URL to process (e.g. https://releases.aspose.com/pdf/net/release-notes/2026/aspose-pdf-for-net-26-6-release-notes/)
        required: true
        type: string
      verbose:
        description: Enable debug-level logging (-v)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  MCP_SERVERS_DIR: ${{ github.workspace }}/mcp-servers

jobs:
  generate:
    name: Generate Blog Draft
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r agent_engine/blog_generator/requirements.txt
          pip install -r mcp-servers/requirements.txt
          pip install -r agent_engine/release_notes_blog_generator/requirements.txt

      - name: Verify package import
        shell: bash
        run: |
          set -euo pipefail
          python -c "from agent_engine.release_notes_blog_generator import cli; print(cli.__file__)"

      - name: Create runtime .env file with secrets
        shell: bash
        run: |
          set -euo pipefail
          cat > .env << EOF
          PROFESSIONALIZE_BASE_URL=${{ secrets.PROFESSIONALIZE_BASE_URL }}
          PROFESSIONALIZE_API_KEY_1=${{ secrets.PROFESSIONALIZE_API_KEY_1 }}
          PROFESSIONALIZE_API_KEY_2=${{ secrets.PROFESSIONALIZE_API_KEY_1 }}
          PROFESSIONALIZE_LLM_MODEL=${{ secrets.PROFESSIONALIZE_LLM_MODEL }}
          PROFESSIONALIZE_EMBEDDING_MODEL=${{ secrets.PROFESSIONALIZE_EMBEDDING_MODEL }}
          SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}
          METRICS_API_URL=${{ secrets.METRICS_API_URL }}
          MUZAMMIL_KHAN_METRICS_API_KEY=${{ secrets.MUZAMMIL_KHAN_METRICS_API_KEY }}
          METRICS_JOB_TYPE=Blog Post Generation
          EOF
          echo ".env file created"

      - name: Generate blog draft
        id: generate
        shell: bash
        env:
          RELEASE_NOTES_URL: ${{ inputs.release_notes_url }}
          VERBOSE: ${{ inputs.verbose }}
        run: |
          set -euo pipefail
          args=(-m agent_engine.release_notes_blog_generator.cli "$RELEASE_NOTES_URL")
          if [ "$VERBOSE" = "true" ]; then
            args+=(-v)
          fi
          python "${args[@]}"

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          echo "## Release Notes Blog Generator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source URL:** ${{ inputs.release_notes_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d output ] && [ -n "$(find output -mindepth 1 -maxdepth 1 -type d -not -name meta)" ]; then
            echo "### Draft(s) generated" >> "$GITHUB_STEP_SUMMARY"
            for dir in output/*/; do
              slug="$(basename "$dir")"
              [ "$slug" = "meta" ] && continue
              echo "- \`$slug\`" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No draft(s) were produced by this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated draft(s)
        if: success() && github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d output ]; then
            echo "No output directory was produced; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output

          if git diff --cached --quiet; then
            echo "No draft changes to commit."
            exit 0
          fi

          git commit -m "Add generated release-notes blog draft(s) [Run #${{ github.run_number }}]

          Source: ${{ inputs.release_notes_url }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated draft(s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-blog-draft-${{ github.run_number }}
          path: output/**
          if-no-files-found: warn
