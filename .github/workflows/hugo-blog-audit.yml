name: Hugo Blog Audit Agent

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      blog_config:
        description: Blog audit config path in this repository.
        required: true
        default: configs/aspose.yaml
        type: string
      product:
        description: Product/path filter.
        required: true
        type: choice
        options:
          - Aspose.blog/3d
          - Aspose.blog/barcode
          - Aspose.blog/cad
          - Aspose.blog/cells
          - Aspose.blog/diagram
          - Aspose.blog/drawing
          - Aspose.blog/email
          - Aspose.blog/finance
          - Aspose.blog/font
          - Aspose.blog/gis
          - Aspose.blog/html
          - Aspose.blog/imaging
          - Aspose.blog/note
          - Aspose.blog/ocr
          - Aspose.blog/omr
          - Aspose.blog/page
          - Aspose.blog/pdf
          - Aspose.blog/psd
          - Aspose.blog/pub
          - Aspose.blog/slides
          - Aspose.blog/svg
          - Aspose.blog/tasks
          - Aspose.blog/tex
          - Aspose.blog/words
          - Aspose.blog/zip
      post_date:
        description: Optional YYYY-MM-DD post date filter.
        required: false
        type: string
      mode:
        description: Audit mode.
        required: true
        default: report
        type: choice
        options:
          - report
          - report-with-fix-suggestions
          - report-with-draft-fixes
      include_translations:
        description: Include translated Markdown files.
        required: true
        default: false
        type: boolean
      detailed_outputs:
        description: Generate the full detailed report set.
        required: true
        default: true
        type: boolean
      llm_suggestions:
        description: Enable optional LLM suggestions.
        required: true
        default: false
        type: boolean
      send_metrics:
        description: Send metrics to the metrics API.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/agent_engine

jobs:
  quality:
    name: Quality Gates
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]"
          elif [ ! -f requirements.txt ]; then
            echo "No requirements.txt or pyproject.toml found. Add one for CI installs."
            exit 1
          else
            python -m pip install -r requirements.txt
          fi

      - name: Verify package import
        shell: bash
        run: |
          set -euo pipefail
          python -c "import hugo_blog_audit_agent; print(hugo_blog_audit_agent.__file__)"

      - name: Lint
        run: python -m ruff check agent_engine tests

      - name: Compile package
        run: python -m compileall agent_engine tests

      - name: Run tests with coverage
        run: python -m pytest --cov=hugo_blog_audit_agent --cov-report=term-missing --cov-report=xml

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Build container image
        run: docker build -t hugo-blog-audit-agent:ci .

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn

  secret-scan:
    name: Secret Scan
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Manual Blog Audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      PROFESSIONALIZE_BASE_URL: ${{ secrets.PROFESSIONALIZE_BASE_URL }}
      PROFESSIONALIZE_API_KEY: ${{ secrets.PROFESSIONALIZE_API_KEY_1 }}
      PROFESSIONALIZE_LLM_MODEL: ${{ secrets.PROFESSIONALIZE_LLM_MODEL }}
      PROFESSIONALIZE_EMBEDDING_MODEL: ${{ secrets.PROFESSIONALIZE_EMBEDDING_MODEL }}
      METRICS_API_URL: ${{ secrets.METRICS_API_URL }}
      MUZAMMIL_KHAN_METRICS_API_KEY: ${{ secrets.MUZAMMIL_KHAN_METRICS_API_KEY }}
      METRICS_JOB_TYPE: test

    steps:
      - name: Check out audit agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          elif [ ! -f requirements.txt ]; then
            echo "No requirements.txt or pyproject.toml found. Add one for CI installs."
            exit 1
          fi

      - name: Verify package import
        shell: bash
        run: |
          set -euo pipefail
          python -c "import hugo_blog_audit_agent; print(hugo_blog_audit_agent.__file__)"

      - name: Prepare CI audit config
        env:
          BLOG_CONFIG: ${{ inputs.blog_config }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          source = Path(os.environ["BLOG_CONFIG"])
          target = Path("outputs/workflow-blog-config.yaml")
          target.parent.mkdir(parents=True, exist_ok=True)

          data = yaml.safe_load(source.read_text(encoding="utf-8")) or {}

          workspace = Path.cwd().resolve()

          def workspace_relative(path):
              path = Path(path)
              try:
                  return path.resolve().relative_to(workspace).as_posix()
              except ValueError:
                  return path.as_posix()

          def resolve_config_path(value):
              if not value:
                  return value
              candidate = Path(str(value))
              if candidate.is_absolute():
                  return candidate
              source_relative = (source.parent / candidate).resolve()
              if source_relative.exists():
                  return source_relative
              return candidate

          def rewrite_path(container, key):
              value = container.get(key)
              if value:
                  container[key] = workspace_relative(resolve_config_path(value))

          repositories = data.setdefault("repositories", [])
          blog_repo = None
          for repo in repositories:
              if isinstance(repo, dict) and repo.get("repo_type", "blog") == "blog":
                  blog_repo = repo
                  break

          if blog_repo is None:
              blog_repo = {"repo_key": "blog", "repo_type": "blog"}
              repositories.append(blog_repo)

          audit = data.setdefault("audit", {})
          repo_url = blog_repo.get("repo_url") or audit.get("repo_url") or data.get("repo_url")
          branch = blog_repo.get("branch") or audit.get("branch") or data.get("branch")

          if not repo_url:
              raise SystemExit(f"{source} must define repositories[].repo_url or audit.repo_url for the Hugo blog repository.")

          blog_repo.pop("repo_path", None)
          blog_repo.pop("local_path", None)
          blog_repo["repo_url"] = repo_url
          if branch:
              blog_repo["branch"] = branch

          audit.pop("repo_path", None)
          audit.pop("local_path", None)
          audit["repo_url"] = repo_url
          if branch:
              audit["branch"] = branch
          audit.setdefault("output_dir", "outputs")
          rewrite_path(audit, "product_config_dir")
          rewrite_path(audit, "file_formats_path")
          rewrite_path(audit, "file_formats")
          audit["policy_files"] = [
              workspace_relative(resolve_config_path(policy_file))
              for policy_file in audit.get("policy_files", []) or []
          ]

          target.write_text(yaml.safe_dump(data, sort_keys=False), encoding="utf-8")
          print(f"Selected Hugo blog repository: {repo_url}")
          print(f"Selected Hugo blog branch: {branch or 'default'}")
          print(f"Product config directory: {audit.get('product_config_dir') or 'not configured'}")
          print(f"Wrote {target}")
          PY

      - name: Configure GitHub repository authentication
        shell: bash
        env:
          HUGO_BLOG_REPO_TOKEN: ${{ secrets.ASPOSE_BLOG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HUGO_BLOG_REPO_TOKEN:-}" ]; then
            echo "HUGO_BLOG_REPO_TOKEN is not set. Private GitHub blog repositories may fail to clone."
            exit 0
          fi
          git config --global url."https://x-access-token:${HUGO_BLOG_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run audit
        env:
          PRODUCT: ${{ inputs.product }}
          POST_DATE: ${{ inputs.post_date }}
          MODE: ${{ inputs.mode }}
          INCLUDE_TRANSLATIONS: ${{ inputs.include_translations }}
          DETAILED_OUTPUTS: ${{ inputs.detailed_outputs }}
          LLM_SUGGESTIONS: ${{ inputs.llm_suggestions }}
          SEND_METRICS: ${{ inputs.send_metrics }}
        run: |
          args=(
            --blog-config outputs/workflow-blog-config.yaml
            --product "$PRODUCT"
            --mode "$MODE"
            --include-translations "$INCLUDE_TRANSLATIONS"
            --detailed-outputs "$DETAILED_OUTPUTS"
            --llm-suggestions "$LLM_SUGGESTIONS"
            --send-metrics "$SEND_METRICS"
            --verbose
          )

          if [ -n "$POST_DATE" ]; then
            args+=(--post-date "$POST_DATE")
          fi

          python -m hugo_blog_audit_agent "${args[@]}"

      - name: Add audit summary
        if: always()
        run: |
          metrics_file="$(find outputs/audit -name audit-metrics.json -print -quit 2>/dev/null || true)"
          action_items_file="$(find outputs/audit -name audit-action-items.md -print -quit 2>/dev/null || true)"

          echo "## Hugo Blog Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$metrics_file" ]; then
            echo "### Metrics" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json, pathlib, sys; metrics=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); keys=["status","blog_name","product","product_name","product_filter","post_date_filter","markdown_files_scanned","total_issues","technical_issues","internal_linking_issues","code_api_issues","duration_seconds"]; print(json.dumps({key: metrics.get(key) for key in keys}, indent=2))' "$metrics_file" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$action_items_file" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Action Items" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,120p' "$action_items_file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No audit action-items report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit audit reports
        if: success() && github.ref_type == 'branch'
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          POST_DATE: ${{ inputs.post_date }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ ! -d outputs/audit ]; then
            echo "No outputs/audit directory was produced; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/audit

          if git diff --cached --quiet; then
            echo "No audit report changes to commit."
            exit 0
          fi

          product_slug="${PRODUCT//\//-}"
          commit_message="Add Hugo audit reports for ${product_slug}"
          if [ -n "${POST_DATE:-}" ]; then
            commit_message="${commit_message} (${POST_DATE})"
          fi
          commit_message="${commit_message} [${MODE}]"

          git commit -m "${commit_message}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-blog-audit-${{ github.run_id }}
          path: |
            outputs/audit/**
            outputs/workflow-blog-config.yaml
          if-no-files-found: warn
