name: Hugo Blog Audit Agent

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      blog_config:
        description: Blog audit config path in this repository.
        required: true
        default: configs/aspose.yaml
        type: string
      product:
        description: Product/path filter.
        required: true
        type: choice
        options:
          - Aspose.blog/3d
          - Aspose.blog/barcode
          - Aspose.blog/cad
          - Aspose.blog/cells
          - Aspose.blog/diagram
          - Aspose.blog/drawing
          - Aspose.blog/email
          - Aspose.blog/finance
          - Aspose.blog/font
          - Aspose.blog/gis
          - Aspose.blog/html
          - Aspose.blog/imaging
          - Aspose.blog/note
          - Aspose.blog/ocr
          - Aspose.blog/omr
          - Aspose.blog/page
          - Aspose.blog/pdf
          - Aspose.blog/psd
          - Aspose.blog/pub
          - Aspose.blog/slides
          - Aspose.blog/svg
          - Aspose.blog/tasks
          - Aspose.blog/tex
          - Aspose.blog/words
          - Aspose.blog/zip
      post_date:
        description: Optional YYYY-MM-DD post date filter.
        required: false
        type: string
      mode:
        description: Audit mode.
        required: true
        default: report
        type: choice
        options:
          - report
          - report-with-fix-suggestions
          - report-with-draft-fixes
      include_translations:
        description: Include translated Markdown files.
        required: true
        default: false
        type: boolean
      detailed_outputs:
        description: Generate the full detailed report set.
        required: true
        default: true
        type: boolean
      llm_suggestions:
        description: Enable optional LLM suggestions.
        required: true
        default: false
        type: boolean
      send_metrics:
        description: Send metrics webhooks.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/agent_engine

jobs:
  test:
    name: Test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          elif [ ! -f requirements.txt ]; then
            echo "No requirements.txt or pyproject.toml found. Add one for CI installs."
            exit 1
          fi

      - name: Verify package import
        shell: bash
        run: |
          set -euo pipefail
          python -c "import hugo_blog_audit_agent; print(hugo_blog_audit_agent.__file__)"

      - name: Compile package
        run: python -m compileall agent_engine

      - name: Run tests
        run: python -m pytest

  audit:
    name: Manual Blog Audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      PROFESSIONALIZE_BASE_URL: ${{ secrets.PROFESSIONALIZE_BASE_URL }}
      PROFESSIONALIZE_API_KEY: ${{ secrets.PROFESSIONALIZE_API_KEY }}
      PROFESSIONALIZE_LLM_MODEL: ${{ secrets.PROFESSIONALIZE_LLM_MODEL }}
      PROFESSIONALIZE_EMBEDDING_MODEL: ${{ secrets.PROFESSIONALIZE_EMBEDDING_MODEL }}
      METRICS_WEBHOOK_URL_PROD: ${{ secrets.METRICS_WEBHOOK_URL_PROD }}
      TOKEN_FOR_PROD: ${{ secrets.TOKEN_FOR_PROD }}
      METRICS_WEBHOOK_URL_TEAM: ${{ secrets.METRICS_WEBHOOK_URL_TEAM }}
      TOKEN_FOR_TEAM: ${{ secrets.TOKEN_FOR_TEAM }}

    steps:
      - name: Check out audit agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          elif [ ! -f requirements.txt ]; then
            echo "No requirements.txt or pyproject.toml found. Add one for CI installs."
            exit 1
          fi

      - name: Verify package import
        shell: bash
        run: |
          set -euo pipefail
          python -c "import hugo_blog_audit_agent; print(hugo_blog_audit_agent.__file__)"

      - name: Prepare CI audit config
        env:
          BLOG_CONFIG: ${{ inputs.blog_config }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          source = Path(os.environ["BLOG_CONFIG"])
          target = Path("outputs/workflow-blog-config.yaml")
          target.parent.mkdir(parents=True, exist_ok=True)

          data = yaml.safe_load(source.read_text(encoding="utf-8")) or {}
          repositories = data.setdefault("repositories", [])
          blog_repo = None
          for repo in repositories:
              if isinstance(repo, dict) and repo.get("repo_type", "blog") == "blog":
                  blog_repo = repo
                  break

          if blog_repo is None:
              blog_repo = {"repo_key": "blog", "repo_type": "blog"}
              repositories.append(blog_repo)

          audit = data.setdefault("audit", {})
          repo_url = blog_repo.get("repo_url") or audit.get("repo_url") or data.get("repo_url")
          branch = blog_repo.get("branch") or audit.get("branch") or data.get("branch")

          if not repo_url:
              raise SystemExit(f"{source} must define repositories[].repo_url or audit.repo_url for the Hugo blog repository.")

          blog_repo.pop("repo_path", None)
          blog_repo.pop("local_path", None)
          blog_repo["repo_url"] = repo_url
          if branch:
              blog_repo["branch"] = branch

          audit.pop("repo_path", None)
          audit.pop("local_path", None)
          audit["repo_url"] = repo_url
          if branch:
              audit["branch"] = branch
          audit.setdefault("output_dir", "outputs")

          target.write_text(yaml.safe_dump(data, sort_keys=False), encoding="utf-8")
          print(f"Selected Hugo blog repository: {repo_url}")
          print(f"Selected Hugo blog branch: {branch or 'default'}")
          print(f"Wrote {target}")
          PY

      - name: Run audit
        env:
          PRODUCT: ${{ inputs.product }}
          POST_DATE: ${{ inputs.post_date }}
          MODE: ${{ inputs.mode }}
          INCLUDE_TRANSLATIONS: ${{ inputs.include_translations }}
          DETAILED_OUTPUTS: ${{ inputs.detailed_outputs }}
          LLM_SUGGESTIONS: ${{ inputs.llm_suggestions }}
          SEND_METRICS: ${{ inputs.send_metrics }}
        run: |
          args=(
            --blog-config outputs/workflow-blog-config.yaml
            --product "$PRODUCT"
            --mode "$MODE"
            --include-translations "$INCLUDE_TRANSLATIONS"
            --detailed-outputs "$DETAILED_OUTPUTS"
            --llm-suggestions "$LLM_SUGGESTIONS"
            --send-metrics "$SEND_METRICS"
            --verbose
          )

          if [ -n "$POST_DATE" ]; then
            args+=(--post-date "$POST_DATE")
          fi

          python -m hugo_blog_audit_agent "${args[@]}"

      - name: Add audit summary
        if: always()
        run: |
          metrics_file="$(find outputs/audit -name audit-metrics.json -print -quit 2>/dev/null || true)"
          action_items_file="$(find outputs/audit -name audit-action-items.md -print -quit 2>/dev/null || true)"

          echo "## Hugo Blog Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$metrics_file" ]; then
            echo "### Metrics" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json, pathlib, sys; metrics=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); keys=["status","blog_name","product_filter","post_date_filter","markdown_files_scanned","total_issues","technical_issues","internal_linking_issues","code_api_issues","duration_seconds"]; print(json.dumps({key: metrics.get(key) for key in keys}, indent=2))' "$metrics_file" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$action_items_file" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Action Items" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,120p' "$action_items_file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No audit action-items report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-blog-audit-${{ github.run_id }}
          path: |
            outputs/audit/**
            outputs/workflow-blog-config.yaml
          if-no-files-found: warn
