name: Keyword Analyzer for Google Sheets

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Select Blog."
        type: choice
        required: true
        options:
          - 'Aspose'
          - 'Conholdate'
          - 'Familiarize'
          - 'GroupDocs'
          - 'Aspose.Cloud'
          - 'Conholdate.Cloud'
          - 'GroupDocs.Cloud'
        default: 'Aspose'

      platform:
        description: "Target platform."
        required: true
        type: choice
        options:
          - 'Java'
          - '.NET'
          - 'C++'
          - 'PHP'
          - 'SharePoint'
          - 'JasperReports'
          - 'Reporting Services'
          - 'JavaScript via C++'
          - 'Go via C++'
          - 'Rust via C++'
          - 'Node.js via C++'
          - 'Node.js via Java'
          - 'Node.js via .NET'
          - 'PHP via Java'
          - 'Python via .NET'
          - 'Python via Java'
          - 'Android via Java'

      google_sheet_row:
        description: "Google Sheet row number to process from the brand's All Missing Topics sheet."
        type: string
        required: true

      keyword_source:
        description: "Keyword source for expanding the selected sheet topic."
        type: choice
        required: true
        options:
          - 'serp_api'
          - 'llm_keywords'
        default: 'llm_keywords'

      output_worksheet_mode:
        description: "How to choose the output worksheet in the brand spreadsheet."
        type: choice
        required: true
        options:
          - 'product_suffix'
          - 'product_full'
          - 'fixed'
        default: 'product_suffix'

      output_worksheet_name:
        description: "Worksheet to use only when output_worksheet_mode=fixed."
        type: string
        required: false
        default: ""

      top_clusters:
        description: "How many top clusters to keep (number as text)."
        type: string
        required: false
        default: "15"

      use_content_index:
        description: "Clone the matching blog repo and dedupe topics against existing posts."
        type: boolean
        required: false
        default: false

      include_product_in_title:
        description: "Enforce product name in generated topic titles. If false, ensure product name is NOT used in titles."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run-kra:
    runs-on: ubuntu-latest

    env:
      KRA_METRICS_DB_PATH: "content/kra_metrics_db.json"
      PROFESSIONALIZE_BASE_URL: "https://llm.professionalize.com/v1"
      PROFESSIONALIZE_API_KEY: ${{ secrets.PROFESSIONALIZE_API_KEY_1 }}
      OPENAI_API_KEY: ${{ secrets.PROFESSIONALIZE_API_KEY_1 }}
      METRICS_WEBHOOK_URL_PROD: ${{ vars.METRICS_WEBHOOK_URL_PROD || vars.GOOGLE_SCRIPT_URL_FOR_PROD }}
      METRICS_WEBHOOK_URL_TEAM: ${{ vars.METRICS_WEBHOOK_URL_TEAM || vars.GOOGLE_SCRIPT_URL_FOR_TEAM }}
      TOKEN_FOR_PROD: ${{ secrets.TOKEN_FOR_PROD }}
      TOKEN_FOR_TEAM: ${{ secrets.TOKEN_FOR_TEAM }}
      METRICS_TIMEOUT_S: "30"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ASPOSE_COM_SPREADSHEET_ID_FOR_KEYWORDS: ${{ secrets.ASPOSE_COM_SPREADSHEET_ID_FOR_KEYWORDS }}
      CONHOLDATE_COM_SPREADSHEET_ID_FOR_KEYWORDS: ${{ secrets.CONHOLDATE_COM_SPREADSHEET_ID_FOR_KEYWORDS }}
      GROUPDOCS_COM_SPREADSHEET_ID_FOR_KEYWORDS: ${{ secrets.GROUPDOCS_COM_SPREADSHEET_ID_FOR_KEYWORDS }}
      ASPOSE_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS: ${{ secrets.ASPOSE_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS }}
      CONHOLDATE_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS: ${{ secrets.CONHOLDATE_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS }}
      GROUPDOCS_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS: ${{ secrets.GROUPDOCS_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS }}
      KRA_SHEET_FAMILIARIZE_URL: ${{ secrets.KRA_SHEET_FAMILIARIZE_URL }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve brand config
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          brand = os.environ["INPUT_BRAND"]
          brand_map = {
              "Aspose": {
                  "brand_folder": "Aspose",
                  "blog_repo": "Aspose/aspose-blog",
                  "blog_root": "blog_content/content/Aspose.Blog",
                  "blog_name": "aspose.com",
                  "repo_url": "https://github.com/Aspose/aspose-blog",
                  "branch": "master",
                  "subdir": "/content/Aspose.Blog",
                  "token_kind": "default",
                  "sheet_url": os.getenv("ASPOSE_COM_SPREADSHEET_ID_FOR_KEYWORDS", ""),
              },
              "Conholdate": {
                  "brand_folder": "Conholdate",
                  "blog_repo": "Conholdate/conholdate-blog",
                  "blog_root": "blog_content/content/Conholdate.Blog",
                  "blog_name": "conholdate.com",
                  "repo_url": "https://github.com/conholdate/conholdate-blog",
                  "branch": "master",
                  "subdir": "/content/Conholdate.Blog",
                  "token_kind": "default",
                  "sheet_url": os.getenv("CONHOLDATE_COM_SPREADSHEET_ID_FOR_KEYWORDS", ""),
              },
              "Familiarize": {
                  "brand_folder": "Familiarize",
                  "blog_repo": "Familiarize/familiarize-blog",
                  "blog_root": "blog_content/content/Familiarize.Blog",
                  "blog_name": "familiarize.com",
                  "repo_url": "https://github.com/Familiarize/familiarize-blog",
                  "branch": "master",
                  "subdir": "/content/Familiarize.Blog",
                  "token_kind": "default",
                  "sheet_url": os.getenv("KRA_SHEET_FAMILIARIZE_URL", ""),
              },
              "GroupDocs": {
                  "brand_folder": "GroupDocs",
                  "blog_repo": "GroupDocs/groupdocs-blog",
                  "blog_root": "blog_content/content/GroupDocs.Blog",
                  "blog_name": "groupdocs.com",
                  "repo_url": "https://github.com/GroupDocs/groupdocs-blog",
                  "branch": "master",
                  "subdir": "/content/GroupDocs.Blog",
                  "token_kind": "default",
                  "sheet_url": os.getenv("GROUPDOCS_COM_SPREADSHEET_ID_FOR_KEYWORDS", ""),
              },
              "Aspose.Cloud": {
                  "brand_folder": "Aspose.Cloud",
                  "blog_repo": "aspose-cloud/aspose-cloud-blog",
                  "blog_root": "blog_content/content",
                  "blog_name": "aspose.cloud",
                  "repo_url": "https://github.com/aspose-cloud/aspose-cloud-blog",
                  "branch": "master",
                  "subdir": "/content",
                  "token_kind": "default",
                  "sheet_url": os.getenv("ASPOSE_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS", ""),
              },
              "Conholdate.Cloud": {
                  "brand_folder": "Conholdate.Cloud",
                  "blog_repo": "conholdate-cloud/blog.conholdate.cloud",
                  "blog_root": "blog_content/content/Conholdate.Cloud/total",
                  "blog_name": "conholdate.cloud",
                  "repo_url": "https://github.com/conholdate-cloud/blog.conholdate.cloud",
                  "branch": "main",
                  "subdir": "/content/Conholdate.Cloud/total",
                  "token_kind": "keyword",
                  "sheet_url": os.getenv("CONHOLDATE_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS", ""),
              },
              "GroupDocs.Cloud": {
                  "brand_folder": "GroupDocs.Cloud",
                  "blog_repo": "groupdocs-cloud/groupdocs-cloud-blog",
                  "blog_root": "blog_content/content",
                  "blog_name": "groupdocs.cloud",
                  "repo_url": "https://github.com/groupdocs-cloud/groupdocs-cloud-blog",
                  "branch": "master",
                  "subdir": "/content",
                  "token_kind": "default",
                  "sheet_url": os.getenv("GROUPDOCS_CLOUD_SPREADSHEET_ID_FOR_KEYWORDS", ""),
              },
          }

          if brand not in brand_map:
              supported = ", ".join(sorted(brand_map))
              raise SystemExit(f"Unsupported brand {brand!r}. Supported brands: {supported}")

          cfg = brand_map[brand]
          sheet_url = str(cfg["sheet_url"] or "").strip()
          if not sheet_url:
              raise SystemExit(
                  f"Missing Google Sheet URL in config.py for brand: {brand}"
              )

          output_dir = f"content/{cfg['brand_folder']}/output"

          env_lines = {
              "BRAND": brand,
              "BLOG_NAME": cfg["blog_name"],
              "BLOG_CONTENT_REPO": cfg["blog_repo"],
              "BLOG_CONTENT_ROOT": cfg["blog_root"],
              "BLOG_REPO_URL": cfg["repo_url"],
              "BLOG_REPO_BRANCH": cfg["branch"],
              "BLOG_REPO_SUBDIR": cfg["subdir"],
              "BLOG_TOKEN_KIND": cfg["token_kind"],
              "GOOGLE_SHEET_INPUT_ID": sheet_url,
              "GOOGLE_SHEET_INPUT_WORKSHEET": "All Missing Topics",
              "KRA_OUTPUT_DIR": output_dir,
          }

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as fh:
              for key, value in env_lines.items():
                  fh.write(f"{key}={value}\n")

          print(f"Resolved brand: {brand}")
          print(f"Resolved blog repo: {cfg['blog_repo']}")
          print(f"Resolved sheet url: {sheet_url}")
          print(f"Resolved output dir: {output_dir}")
          PY
        env:
          INPUT_BRAND: ${{ inputs.brand }}

      - name: Checkout matching blog content repo with default PAT
        if: ${{ inputs.use_content_index && env.BLOG_TOKEN_KIND == 'default' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_CONTENT_REPO }}
          path: blog_content
          token: ${{ secrets.ASPOSE_BLOG_TOKEN }}

      - name: Checkout matching blog content repo with keyword analyzer PAT
        if: ${{ inputs.use_content_index && env.BLOG_TOKEN_KIND == 'keyword' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_CONTENT_REPO }}
          path: blog_content
          token: ${{ secrets['keyword-analyzer-token'] }}

      - name: Export BLOG_CONTENT_ROOT (only if use_content_index=true)
        if: ${{ inputs.use_content_index }}
        run: |
          echo "BLOG_CONTENT_ROOT=${BLOG_CONTENT_ROOT}" >> "$GITHUB_ENV"

      - name: Write Google service account credentials
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is required."
            exit 1
          fi
          cred_path="${RUNNER_TEMP}/google-service-account.json"
          printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > "${cred_path}"
          echo "GOOGLE_SERVICE_ACCOUNT_FILE=${cred_path}" >> "$GITHUB_ENV"

      - name: Build kra_run.generated.yaml
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          def as_bool(v: str) -> bool:
              return (v or "false").strip().lower() == "true"

          def b(v: bool) -> str:
              return "true" if v else "false"

          brand = os.environ["BRAND"]
          platform = os.environ["INPUT_PLATFORM"]
          google_sheet_input_id = os.environ["GOOGLE_SHEET_INPUT_ID"]
          google_sheet_input_worksheet = os.environ["GOOGLE_SHEET_INPUT_WORKSHEET"]
          google_sheet_row = int(os.environ["INPUT_GOOGLE_SHEET_ROW"])
          keyword_source = os.environ.get("INPUT_KEYWORD_SOURCE", "llm_keywords").strip().lower()
          use_serp_api = keyword_source == "serp_api"
          use_llm_keywords = keyword_source == "llm_keywords"
          top_clusters = int(os.environ.get("INPUT_TOP_CLUSTERS", "15"))
          use_content_index = as_bool(os.environ.get("INPUT_USE_CONTENT_INDEX", "false"))
          include_product_in_title = as_bool(os.environ.get("INPUT_INCLUDE_PRODUCT_IN_TITLE", "false"))
          output_mode = os.environ.get("INPUT_OUTPUT_WORKSHEET_MODE", "product_suffix").strip()
          output_worksheet_name = os.environ.get("INPUT_OUTPUT_WORKSHEET_NAME", "").strip()

          locale = "en-US"
          max_rows = 50000
          debug = False

          cfg_path = Path(os.environ["RUNNER_TEMP"]) / "kra_run.generated.yaml"
          blog_name = os.environ.get("BLOG_NAME", "")
          blog_root = os.environ.get("BLOG_CONTENT_ROOT", "")
          repo_url = os.environ.get("BLOG_REPO_URL", "")
          branch = os.environ.get("BLOG_REPO_BRANCH", "")
          subdir = os.environ.get("BLOG_REPO_SUBDIR", "")

          output_worksheet_line = (
              f"  google_sheet_output_worksheet: \"{output_worksheet_name}\"\n"
              if output_worksheet_name else ""
          )

          cfg_text = (
              "meta:\n"
              f"  blog_name: \"{blog_name}\"\n"
              f"  brand: \"{brand}\"\n"
              "  created_at: \"\"\n"
              "  owner: \"content-team\"\n"
              "\n"
              "engine:\n"
              f"  google_sheet_input_id: \"{google_sheet_input_id}\"\n"
              f"  google_sheet_input_worksheet: \"{google_sheet_input_worksheet}\"\n"
              f"  google_sheet_row: {google_sheet_row}\n"
              f"  google_sheet_output_mode: \"{output_mode}\"\n"
              f"{output_worksheet_line}"
              f"  use_serp_api: {b(use_serp_api)}\n"
              f"  use_llm_keywords: {b(use_llm_keywords)}\n"
              f"  platform: \"{platform}\"\n"
              f"  locale: \"{locale}\"\n"
              f"  top_clusters: {top_clusters}\n"
              f"  max_rows: {max_rows}\n"
              f"  use_content_index: {b(use_content_index)}\n"
              f"  include_product_in_title: {b(include_product_in_title)}\n"
              f"  debug: {b(debug)}\n"
              "\n"
              "content_index:\n"
              f"  local_root: \"{blog_root}\"\n"
              "  index_file_name: \"index.md\"\n"
              "  file_glob: \"**/index.md\"\n"
              f"  repo_url: \"{repo_url}\"\n"
              f"  branch: \"{branch}\"\n"
              f"  subdir: \"{subdir}\"\n"
          )

          cfg_path.write_text(cfg_text, encoding="utf-8")
          print("Generated config:", cfg_path)
          print(cfg_text)
          PY

          echo "KRA_CFG_PATH=${RUNNER_TEMP}/kra_run.generated.yaml" >> "$GITHUB_ENV"
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_GOOGLE_SHEET_ROW: ${{ inputs.google_sheet_row }}
          INPUT_KEYWORD_SOURCE: ${{ inputs.keyword_source }}
          INPUT_OUTPUT_WORKSHEET_MODE: ${{ inputs.output_worksheet_mode }}
          INPUT_OUTPUT_WORKSHEET_NAME: ${{ inputs.output_worksheet_name }}
          INPUT_TOP_CLUSTERS: ${{ inputs.top_clusters }}
          INPUT_USE_CONTENT_INDEX: ${{ inputs.use_content_index }}
          INPUT_INCLUDE_PRODUCT_IN_TITLE: ${{ inputs.include_product_in_title }}

      - name: Run KRA
        run: |
          mkdir -p "${KRA_OUTPUT_DIR}"
          python scripts/run_kra_from_config.py --config "${KRA_CFG_PATH}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: kra-output-google-sheets-${{ github.run_number }}
          path: |
            ${{ env.KRA_OUTPUT_DIR }}/**
            content/kra_metrics_db.json
          if-no-files-found: warn

      - name: Commit outputs (with ignore-safe staging)
        run: |
          set -euo pipefail

          echo "=== workspace ==="
          pwd
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "BRAND=${BRAND}"
          echo "KRA_OUTPUT_DIR=${KRA_OUTPUT_DIR}"

          echo "=== list output ==="
          ls -la "${KRA_OUTPUT_DIR}" || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== git status (before add) ==="
          git status --porcelain=v1 || true

          echo "=== check ignore rules for KRA output ==="
          git check-ignore -v "${KRA_OUTPUT_DIR}"/** 2>/dev/null || true

          git add -A content

          echo "=== staged diff (after add -A content) ==="
          git diff --cached --name-status || true

          if git diff --cached --quiet; then
            echo "No staged changes after 'git add -A content'. Trying force-add on KRA outputs..."
            git add -f "${KRA_OUTPUT_DIR}" || true
            git add -f "${KRA_METRICS_DB_PATH}" || true
          fi

          echo "=== staged diff (final) ==="
          git diff --cached --name-status || true

          if git diff --cached --quiet; then
            echo "No staged changes, skipping commit & push"
            exit 0
          fi

          git commit -m "Update ${BRAND} Google Sheets KRA results [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
